    />
    <style>
      html { background: #fdf4ff; }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 45%, #fff7fc 0%, #f6ecff 60%, #efe3fd 100%);
        transition: opacity 600ms ease, visibility 600ms;
      }
      #splash svg { width: 34px; height: 34px; animation: splash-beat 1.1s ease-in-out infinite; filter: drop-shadow(0 6px 18px rgba(236, 72, 153, 0.35)); }
      #splash.splash-out { opacity: 0; visibility: hidden; }
      @keyframes splash-beat { 0%, 100% { transform: scale(0.92); } 45% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="-1.3 -1.1 2.6 2.2"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9A8D4"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><path d="M0 1C-1.25 .25-1.15-.85-.52-.95-.2-1 0-.75 0-.55 0-.75.2-1 .52-.95 1.15-.85 1.25.25 0 1Z" fill="url(#sg)"/></svg>
    </div>
